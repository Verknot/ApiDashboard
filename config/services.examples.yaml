# Example catalog for API Workbench.
# Copy pieces into services.yaml. Do not put real PFX / passwords in git.

splunk_url: 'https://splunk.company.com/en-US/app/search/search?q=search%20ConversationId%3D"#ConversationId#"'

services:
  - name: order-service
    description: UserPortal = token+cert; BackOffice/Backend = certificate
    color: "#4CAF50"
    proxy: true
    portals:
      - name: UserPortal
        swagger:
          url: https://api.dev.company.com/userportal/swagger.yml
          basic:
            username: swagger-reader
            password: REPLACE
            # vault_username: secret/swagger/user
            # vault_password: secret/swagger/pass
        urls:
          dev: https://api.dev.company.com/userportal
          qa: https://api.qa.company.com/userportal
        auth:
          type: token
          token_url: https://auth.{environment}.company.com/token
          cert: client.pfx
          cert_password: REPLACE

      - name: BackOffice
        swagger:
          url: https://api.dev.company.com/backoffice/swagger.json
          basic:
            username: swagger-reader
            password: REPLACE
        urls:
          dev: https://api.dev.company.com/backoffice
          qa: https://api.qa.company.com/backoffice
        auth:
          type: certificate
          cert: client.pfx
          cert_password: REPLACE

      - name: BackendPortal
        swagger:
          url: https://api.dev.company.com/backend/swagger.json
          basic:
            username: swagger-reader
            password: REPLACE
        urls:
          dev: https://api.dev.company.com/backend
          qa: https://api.qa.company.com/backend
        auth:
          type: certificate
          cert: client.pfx
          cert_password: REPLACE

  - name: order-service-regional
    description: Same portals, URLs per region
    color: "#9C27B0"
    proxy: true
    regions: [eu, tr, br, mx]
    default_region: eu
    portals:
      - name: UserPortal
        swagger:
          url: https://api.dev.eu.company.com/userportal/swagger.yml
          basic:
            username: swagger-reader
            password: REPLACE
        urls:
          dev: https://api.dev.{region}.company.com/userportal
          qa: https://api.qa.{region}.company.com/userportal
        auth:
          type: token
          token_url: https://auth.{environment}.{region}.company.com/token
          cert: client.pfx
          cert_password: REPLACE
      - name: BackOffice
        swagger:
          url: https://api.dev.eu.company.com/backoffice/swagger.json
          basic:
            username: swagger-reader
            password: REPLACE
        urls:
          # geo hosts: eu.backoffice… / mx.backoffice…
          dev: https://{region}.backoffice.dev
          qa: https://{region}.backoffice.qa
        # optional non-geo host (no region): https://backoffice-dev
        global_urls:
          dev: https://backoffice-dev
          qa: https://backoffice-qa
        auth:
          type: certificate
          cert: client.pfx
          cert_password: REPLACE
      - name: BackendPortal
        swagger:
          url: https://api.dev.eu.company.com/backend/swagger.json
          basic:
            username: swagger-reader
            password: REPLACE
        urls:
          dev: https://api.dev.{region}.company.com/backend
          qa: https://api.qa.{region}.company.com/backend
        auth:
          type: certificate
          cert: client.pfx
          cert_password: REPLACE

  # Local sample OpenAPI (no Basic)
  - name: demo-local
    description: Local sample
    color: "#607D8B"
    proxy: true
    portals:
      - name: Orders
        swagger:
          url: samples/order-service.json
        urls:
          dev: http://localhost:5157/order
        auth:
          type: none
